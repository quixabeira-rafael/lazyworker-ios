[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lazyworker"
version = "0.1.0"
description = "Agent-friendly iOS automation over WebDriverAgent for simulators and real devices."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Rafael" }]
keywords = ["ios", "automation", "qa", "webdriveragent", "wda", "agentic"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "httpx>=0.27",
    "jq>=1.6",
    "pydantic>=2.6",
    "typer>=0.12",
]

[project.optional-dependencies]
ocr = [
    "ocrmac>=1.0",
    "pillow",
]
detect = [
    "ultralytics>=8.3",
    "transformers==4.49.0",
    "timm",
    "einops>=0.8",
    "huggingface_hub",
    "pillow",
]
dev = [
    "pytest>=8.0",
    "pytest-httpx>=0.30",
    "ruff>=0.5",
    "mypy>=1.10",
    "ocrmac>=1.0",
    "pillow",
]

[project.scripts]
lazyworker = "lazyworker.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/lazyworker"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/lazyworker/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "jq",
    "ocrmac.*",
    "torch.*",
    "ultralytics.*",
    "transformers.*",
    "huggingface_hub.*",
    "PIL.*",
]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
